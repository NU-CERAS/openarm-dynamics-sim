[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "openarm-dynamics-sim"
version = "0.2.0"
description = "Minimal MuJoCo joint jogging and A/B load experiments"
requires-python = ">=3.11,<3.14"
dependencies = [
  "mujoco==3.16.0",
  "numpy>=2.1,<2.4", "scipy>=1.14,<2", "PyYAML>=6,<7",
  "matplotlib>=3.9,<4",
  "imgui-bundle==1.92.900",
  "dash>=3,<5", "plotly>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
arm-sim = "arm_design.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.setuptools.package-data]
arm_design = ["assets/*.css", "assets/*.js", "assets/vendor/*.js", "assets/vendor/*.txt"]
