# MuJoCo arm parameters. Units are in field names; joint angles here are degrees.
# Links are J1->J2, ..., J6->J7, J7->tool. All dimensions are preliminary.
# Each link defaults to a hollow aluminum tube + a bracket at its joint.
# mass_override_kg replaces tube+bracket mass, excluding motors/tool/payload.
# com_override_m is in that joint frame; inertia_override_kg_m2 is [Ixx,Iyy,Izz,Ixy,Ixz,Iyz]
# about the overridden COM, expressed in that joint frame. null = estimated.
# Edit and save, then click Reload YAML. Save A/B buttons persist poses; Save controls persists gains/speeds.
